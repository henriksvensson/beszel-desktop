name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --release --locked --workspace
      - name: Package release archive
        env:
          TARGET: ${{ matrix.target }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="beszel-desktop-${TAG}-${TARGET}"
          mkdir -p "dist/${PKG}"
          cp target/release/beszel-relay target/release/beszel-ctl "dist/${PKG}/"
          cp packaging/systemd/beszel-relay.service packaging/config.example.toml LICENSE README.md "dist/${PKG}/"
          tar -C dist -czf "dist/${PKG}.tar.gz" "${PKG}"
          rm -rf "dist/${PKG}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz

  package-shells:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package shell plugins
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist
          tar -C shells -czf "dist/beszel-desktop-dms-${TAG}.tar.gz" dms
          tar -C shells -czf "dist/beszel-desktop-noctalia-${TAG}.tar.gz" noctalia
          tar -C shells -czf "dist/beszel-desktop-waybar-${TAG}.tar.gz" waybar
      - uses: actions/upload-artifact@v4
        with:
          name: release-shells
          path: dist/*.tar.gz

  publish:
    needs: [build-linux, package-shells]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
